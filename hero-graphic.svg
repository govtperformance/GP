    <text x="26" y="78" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF">• Limited local media</text>
    <text x="26" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF">• Real issues without visibility</text>
    <text x="26" y="138" font-family="Inter, Arial, sans-serif" font-size="18" fill="#FFFFFF">• Citizens needing structure, tools, and safer channels</text>
